[package]
name = "orq-agent"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Real local dispatcher for Orq agents"

[[bin]]
name = "orq-agent"
path = "src/main.rs"

[[bin]]
name = "orq"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
which = "7.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
